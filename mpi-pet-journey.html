<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MPI Pet Import — User Journey + Architecture Walkthrough</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fafaf7;
    --panel: #ffffff;
    --panel-2: #f7f5ef;
    --border: #e5e2da;
    --border-strong: #c8c3b6;
    --ink: #1a1a1a;
    --ink-muted: #555049;
    --ink-faint: #8a857a;
    --accent: #b8541b;
    --accent-soft: #f4e7dc;
    --teal: #1f5d6e;
    --teal-soft: #e0eef2;
    --good: #2d6a3a;
    --good-soft: #e3eee2;
    --warn: #a8500e;
    --warn-soft: #f7ead8;
    --bad: #8a2d2d;
    --bad-soft: #f3e1e1;
    --code-bg: #1f2329;
    --code-ink: #e8e2d4;
    --code-key: #94c3d6;
    --code-str: #d6a584;
    --code-num: #c8b8e6;
    --code-comment: #7c8896;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    font-size: 14px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 22px 22px 80px; }
  header.page {
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }
  header.page h1 {
    font-size: 20px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header.page .sub {
    color: var(--ink-muted);
    font-size: 13px;
  }

  /* ── Stepper ─────────────────────────── */
  .stepper {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
    margin: 0 0 14px;
  }
  .step {
    appearance: none;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 9px 10px 8px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    text-align: left;
    border-radius: 3px;
    color: var(--ink-muted);
    line-height: 1.3;
  }
  .step:hover { border-color: var(--ink-muted); color: var(--ink); }
  .step.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--ink);
  }
  .step .num {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .step.active .num { color: var(--accent); }
  .step.done .num { color: var(--good); }
  .step .nm { font-weight: 600; color: var(--ink); display: block; }
  .step.done .nm::before { content: "✓ "; color: var(--good); }

  /* ── Stage description ─────────────────────────── */
  .stage-desc {
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 12px 16px;
    margin-bottom: 14px;
    border-radius: 3px;
    font-size: 13px;
  }
  .stage-desc strong { color: var(--ink); }
  .stage-desc .meta {
    margin-top: 4px;
    color: var(--ink-faint);
    font-size: 12px;
  }

  /* ── Split view ─────────────────────────── */
  .split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    align-items: stretch;
  }
  @media (max-width: 980px) { .split { grid-template-columns: 1fr; } }

  .col {
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 480px;
  }
  .col-head {
    padding: 8px 14px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    font-weight: 700;
    border-bottom: 1px solid var(--border);
  }
  .col-ui .col-head {
    background: var(--teal-soft);
    color: var(--teal);
  }
  .col-be .col-head {
    background: #2a2f37;
    color: #d8d3c4;
    border-bottom-color: #1a1f25;
  }
  .col-body {
    flex: 1 1 auto;
    overflow-y: auto;
  }
  .col-ui .col-body { background: var(--panel); padding: 14px; }
  .col-be .col-body { background: #1f2329; color: var(--code-ink); padding: 14px; font-size: 12.5px; }

  /* ── UI mock components ─────────────────────────── */
  .ui-app {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    overflow: hidden;
  }
  .ui-app-bar {
    background: var(--teal);
    color: white;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ui-app-bar .right { font-weight: 400; opacity: 0.85; font-size: 11px; }

  /* Chat */
  .chat { padding: 14px; background: var(--panel-2); }
  .bubble {
    margin: 6px 0;
    padding: 8px 12px;
    border-radius: 14px;
    max-width: 88%;
    font-size: 13px;
    line-height: 1.4;
  }
  .bubble.user {
    background: var(--teal);
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  .bubble.agent {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .bubble.agent strong { color: var(--accent); }
  .chat-result {
    margin-top: 12px;
    padding: 12px;
    background: var(--good-soft);
    border-left: 3px solid var(--good);
    font-size: 13px;
  }
  .chat-result h4 {
    margin: 0 0 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--good);
  }
  .cta-row {
    margin-top: 10px;
    text-align: right;
  }
  .cta {
    background: var(--accent);
    color: white;
    border: 0;
    padding: 8px 14px;
    border-radius: 3px;
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }

  /* Plan / timeline */
  .plan-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .plan-head h3 { margin: 0; font-size: 14px; }
  .plan-head .editable {
    color: var(--accent);
    text-decoration: underline dotted;
    cursor: pointer;
    font-size: 12px;
  }
  .plan-row {
    display: grid;
    grid-template-columns: 86px 1fr auto;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
    align-items: center;
  }
  .plan-row .date {
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .plan-row .what { color: var(--ink); }
  .plan-row.done .what { color: var(--ink-muted); }
  .plan-row .tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 9px;
    background: var(--panel-2);
    color: var(--ink-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .plan-row.done .tag { background: var(--good-soft); color: var(--good); }
  .plan-row.due .tag { background: var(--warn-soft); color: var(--warn); }
  .plan-row.flight .tag { background: var(--accent); color: white; }
  .plan-row.flight { background: var(--accent-soft); padding-left: 8px; padding-right: 8px; margin: 4px -8px; }

  /* Form */
  .form-grp {
    margin-bottom: 12px;
  }
  .form-lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    margin-bottom: 4px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
  }
  .form-lbl .ok { color: var(--good); font-weight: 700; }
  .form-lbl .bad { color: var(--bad); font-weight: 700; }
  .input {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    font: inherit;
    font-size: 13px;
    background: var(--panel);
  }
  .input.ok { border-color: var(--good); }
  .input.bad { border-color: var(--bad); }
  .form-hint {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 3px;
  }
  .form-hint.bad { color: var(--bad); }
  .form-side {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 12px;
    margin-top: 12px;
    font-size: 12px;
  }
  .form-side h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-muted); }
  .form-side ul { margin: 0; padding-left: 18px; }
  .form-side li { margin-bottom: 3px; }
  .form-side li.miss { color: var(--bad); }
  .form-side li.ok { color: var(--good); }

  /* Status dashboard */
  .status-bar {
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 10px 12px;
    border-radius: 3px;
    margin-bottom: 10px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .progress {
    flex: 1 1 auto;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress > span {
    display: block;
    height: 100%;
    background: var(--good);
  }
  .req-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .req {
    border: 1px solid var(--border);
    padding: 9px 10px;
    border-radius: 3px;
    font-size: 12px;
  }
  .req.ok { background: var(--good-soft); border-color: #c5dac4; }
  .req.due { background: var(--warn-soft); border-color: #e8d4b0; }
  .req.now { background: var(--accent-soft); border-color: #e5d2bf; }
  .req .ttl {
    font-weight: 600;
    margin-bottom: 2px;
    font-size: 12.5px;
  }
  .req .det { color: var(--ink-muted); font-size: 11.5px; }
  .req .ok-tag, .req .due-tag, .req .now-tag {
    display: inline-block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 9px;
    margin-bottom: 4px;
  }
  .req.ok .ok-tag { background: var(--good); color: white; }
  .req.due .due-tag { background: var(--warn); color: white; }
  .req.now .now-tag { background: var(--accent); color: white; }
  .toast {
    margin-top: 12px;
    padding: 10px 12px;
    background: var(--teal-soft);
    border-left: 3px solid var(--teal);
    font-size: 12.5px;
  }

  /* Inspector view */
  .insp-head {
    background: var(--ink);
    color: white;
    padding: 10px 14px;
    border-radius: 3px 3px 0 0;
    font-size: 12px;
  }
  .insp-head h3 { margin: 0; font-size: 14px; }
  .insp-head .meta { color: #c0bbac; font-size: 11px; margin-top: 2px; }
  .insp-body {
    border: 1px solid var(--border);
    border-top: 0;
    padding: 12px;
    border-radius: 0 0 3px 3px;
  }
  .insp-row {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 8px;
    padding: 4px 0;
    font-size: 12.5px;
  }
  .insp-row dt { color: var(--ink-muted); }
  .insp-row dd { margin: 0; }
  .insp-rec {
    margin-top: 12px;
    padding: 10px;
    background: var(--good-soft);
    border-left: 3px solid var(--good);
    font-size: 12.5px;
  }
  .ins-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .btn-secondary {
    background: var(--panel);
    border: 1px solid var(--border-strong);
    padding: 7px 14px;
    border-radius: 3px;
    font: inherit;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
  }
  .btn-primary {
    background: var(--good);
    color: white;
    border: 0;
    padding: 7px 14px;
    border-radius: 3px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Quarantine */
  .q-head {
    background: var(--good);
    color: white;
    padding: 10px 14px;
    border-radius: 3px;
    font-size: 13px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .q-day {
    font-size: 18px;
    font-weight: 700;
  }
  .q-list {
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .q-row {
    display: flex;
    padding: 7px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
    justify-content: space-between;
  }
  .q-row:last-child { border-bottom: 0; }
  .q-row.done { color: var(--ink-muted); }
  .q-row.done .check { color: var(--good); }

  /* ── Backend representations ─────────────────────────── */
  .be-block {
    background: #2a2f37;
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 12px;
    border: 1px solid #1a1f25;
  }
  .be-block .be-head {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: #94c3d6;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .be-block .be-head .badge {
    background: #94c3d6;
    color: #1f2329;
    padding: 1px 6px;
    border-radius: 8px;
    font-size: 9px;
    letter-spacing: 0.04em;
  }
  .be-block .be-head .badge.warn {
    background: #d6a584;
  }
  .be-note {
    font-size: 11.5px;
    color: #c0bbac;
    margin: 0 0 6px;
    line-height: 1.45;
  }
  .be-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    color: var(--code-ink);
    white-space: pre-wrap;
    line-height: 1.5;
    margin: 0;
  }
  .be-code .k { color: var(--code-key); }
  .be-code .s { color: var(--code-str); }
  .be-code .n { color: var(--code-num); }
  .be-code .c { color: var(--code-comment); }

  .be-rules {
    list-style: none;
    margin: 6px 0 0 0;
    padding: 0;
    font-size: 12px;
  }
  .be-rules li {
    padding: 4px 0;
    border-bottom: 1px dotted #3a414a;
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .be-rules li:last-child { border-bottom: 0; }
  .be-rules .nm {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    color: var(--code-ink);
  }
  .be-rules .out { color: #b6dcb6; font-weight: 600; font-size: 11px; }
  .be-rules .out.fail { color: #e6b3b3; }
  .be-rules .out.skip { color: var(--code-comment); }

  .be-arrow {
    text-align: center;
    color: #5a6571;
    font-size: 18px;
    margin: -2px 0 6px;
  }

  /* ── Stage nav ─────────────────────────── */
  .stage-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
  }
  .stage-nav button {
    background: var(--panel);
    border: 1px solid var(--border-strong);
    padding: 8px 16px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    border-radius: 3px;
    color: var(--ink);
  }
  .stage-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
  .stage-nav button:hover:not(:disabled) { border-color: var(--ink-muted); }
  .stage-nav .right { display: flex; gap: 8px; }
  .stage-nav .play {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* ── Layer diagram on stage 0 ─────────────────────────── */
  .layer-stack {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 14px;
    margin-bottom: 14px;
  }
  .layer {
    border: 1px solid var(--border);
    padding: 10px 14px;
    margin-bottom: 6px;
    background: var(--panel-2);
    font-size: 13px;
  }
  .layer .role {
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .layer .nm { font-weight: 600; color: var(--ink); }
  .layer .det { color: var(--ink-muted); font-size: 12px; margin-top: 2px; }
  .layer.l3 { background: var(--accent-soft); border-color: var(--accent); }
  .layer.l3 .role { color: var(--accent); }
  .arrow-down {
    text-align: center;
    color: var(--ink-faint);
    font-size: 16px;
    line-height: 1;
    margin: -2px 0 4px;
  }

</style>
</head>
<body>
<div class="wrap">

<header class="page">
  <h1>MPI pet import — proposed user journey + architecture</h1>
  <div class="sub">Six stages of the importer experience, with the rules-engine activity beneath. <strong>UX on the left, what's happening behind it on the right.</strong></div>
</header>

<nav class="stepper" id="stepper">
  <!-- populated by JS -->
</nav>

<div class="stage-desc" id="stageDesc"></div>

<div class="split" id="split">
  <div class="col col-ui">
    <div class="col-head">UX — what the user sees</div>
    <div class="col-body" id="uiBody"></div>
  </div>
  <div class="col col-be">
    <div class="col-head">Behind the scenes — facts, rules, decisions</div>
    <div class="col-body" id="beBody"></div>
  </div>
</div>

<div class="stage-nav">
  <button id="prevBtn">← Previous stage</button>
  <div class="right">
    <button id="playBtn" class="play">▶ Play through</button>
    <button id="nextBtn">Next stage →</button>
  </div>
</div>

</div>

<script>
const STAGES = [
  // ─────────────────────────────────────────────────── Stage 1
  {
    id: 'discovery',
    num: '01',
    name: 'Discovery',
    persona: 'Importer · Sarah in London',
    desc: '<strong>Conversational intake.</strong> An LLM-led agent elicits enough facts about the animal, the owner and the travel plan to determine the regulatory pathway. The agent translates between natural language and structured facts; the rules engine returns the applicable rule pack.',
    meta: 'LLM agent · rules engine called once · reference data: country categorisation, prohibited breeds',
    ui: () => `
      <div class="ui-app">
        <div class="ui-app-bar">
          <span>MPI Pet Import Assistant</span>
          <span class="right">claude · NZ Biosecurity</span>
        </div>
        <div class="chat">
          <div class="bubble agent">Hi! I can help you bring a cat or dog into New Zealand. Where are you travelling from, and is this a pet, an assistance dog, or arriving by boat?</div>
          <div class="bubble user">Pet dog from London to Auckland</div>
          <div class="bubble agent">Got it. A few quick questions — what breed, age and is your dog microchipped?</div>
          <div class="bubble user">Border collie, 4 years old, female, microchipped</div>
          <div class="bubble agent">Perfect. When are you hoping to travel?</div>
          <div class="bubble user">Around July 2026</div>
          <div class="bubble agent">Thanks! Based on what you've told me…</div>
          <div class="chat-result">
            <h4>✓ Eligible to import</h4>
            <strong>UK is a Category 3 country.</strong> You'll need an import permit, a 10-day quarantine in NZ, plus rabies vaccination and a titre test. I've drafted a 6-month compliance plan.
          </div>
          <div class="cta-row"><button class="cta">View compliance plan →</button></div>
        </div>
      </div>
    `,
    be: () => `
      <div class="be-block">
        <div class="be-head"><span>① LLM fact extraction</span><span class="badge">PARSE</span></div>
        <p class="be-note">Agent's job is to elicit and structure facts — not to make decisions. All compliance logic stays deterministic in the rules engine.</p>
<pre class="be-code"><span class="c">// extracted from chat</span>
{
  <span class="k">"species"</span>: <span class="s">"Canis familiaris"</span>,
  <span class="k">"breed"</span>: <span class="s">"Border Collie"</span>,
  <span class="k">"age_years"</span>: <span class="n">4</span>,
  <span class="k">"sex"</span>: <span class="s">"female"</span>,
  <span class="k">"microchipped"</span>: <span class="n">true</span>,
  <span class="k">"country_of_export"</span>: <span class="s">"GB"</span>,
  <span class="k">"target_shipment"</span>: <span class="s">"2026-07-15"</span>,
  <span class="k">"pathway"</span>: <span class="s">"standard_pet"</span>
}</pre>
      </div>
      <div class="be-arrow">▼</div>
      <div class="be-block">
        <div class="be-head"><span>② Rules engine — eligibility check</span><span class="badge">DROOLS</span></div>
        <p class="be-note"><code>POST /eligibility-check</code> · stateless evaluation against the cats/dogs rule pack</p>
        <ul class="be-rules">
          <li><span class="nm">country-category-classifier</span><span class="out">→ Category 3</span></li>
          <li><span class="nm">breed-prohibition (Dog Control Act Sch 4)</span><span class="out">→ pass</span></li>
          <li><span class="nm">species-eligibility (IHS § 1.1.1)</span><span class="out">→ pass</span></li>
          <li><span class="nm">hybrid-eligibility (IHS § 1.1.1(a))</span><span class="out">→ pass</span></li>
          <li><span class="nm">pathway-selection</span><span class="out">→ standard_pet</span></li>

const stepperEl = document.getElementById('stepper');
const stageDescEl = document.getElementById('stageDesc');
const uiBodyEl = document.getElementById('uiBody');
const beBodyEl = document.getElementById('beBody');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const playBtn = document.getElementById('playBtn');

let currentStage = 0;
let playInterval = null;

function renderStepper() {
  stepperEl.innerHTML = '';
  STAGES.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'step' + (i === currentStage ? ' active' : (i < currentStage ? ' done' : ''));
    btn.innerHTML = '<span class="num">Stage ' + s.num + '</span><span class="nm">' + s.name + '</span>';
    btn.addEventListener('click', () => { stopPlay(); setStage(i); });
    stepperEl.appendChild(btn);
  });
}

function renderStage() {
  const s = STAGES[currentStage];
  stageDescEl.innerHTML = '<div>' + s.desc + '</div><div class="meta">' + s.persona + ' · ' + s.meta + '</div>';
  uiBodyEl.innerHTML = s.ui();
  beBodyEl.innerHTML = s.be();
  prevBtn.disabled = currentStage === 0;
  nextBtn.disabled = currentStage === STAGES.length - 1;
  // Persist
  try { localStorage.setItem('mpi-journey-stage', currentStage); } catch(e) {}
}

function setStage(i) {
  currentStage = Math.max(0, Math.min(STAGES.length - 1, i));
  renderStepper();
  renderStage();
}

function stopPlay() {
  if (playInterval) {
    clearInterval(playInterval);
    playInterval = null;
    playBtn.textContent = '▶ Play through';
  }
}

playBtn.addEventListener('click', () => {
  if (playInterval) { stopPlay(); return; }
  playBtn.textContent = '◼ Stop';
  playInterval = setInterval(() => {
    if (currentStage >= STAGES.length - 1) { stopPlay(); return; }
    setStage(currentStage + 1);
  }, 3500);
});

prevBtn.addEventListener('click', () => { stopPlay(); setStage(currentStage - 1); });
nextBtn.addEventListener('click', () => { stopPlay(); setStage(currentStage + 1); });

// Restore last stage
try {
  const saved = parseInt(localStorage.getItem('mpi-journey-stage'), 10);
  if (!isNaN(saved) && saved >= 0 && saved < STAGES.length) currentStage = saved;
} catch(e) {}

renderStepper();
renderStage();
</script>
</body>
