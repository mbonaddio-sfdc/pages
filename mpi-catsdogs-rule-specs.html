<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MPI — Cats & Dogs full rule specs</title>
<style>
  :root{
    color-scheme:light;
    --bg:#fafaf7;--panel:#fff;--panel-2:#f7f5ef;--border:#e5e2da;--border-strong:#c8c3b6;
    --ink:#1a1a1a;--ink-muted:#555049;--ink-faint:#8a857a;
    --accent:#b8541b;--accent-soft:#f4e7dc;--teal:#1f5d6e;--teal-soft:#e0eef2;
    --purple:#6b4a8a;--purple-soft:#efe7f6;--good:#2d6a3a;--good-soft:#e3eee2;
    --gold:#8a6d1e;--gold-soft:#f5edd6;--bad:#8a2d2d;--bad-soft:#f3e1e1;--code:#1f2329;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5}
  .top{padding:16px 22px;border-bottom:1px solid var(--border);background:var(--panel)}
  .top h1{font-size:18px;margin:0 0 2px}
  .top .sub{font-size:12.5px;color:var(--ink-muted)}
  .layout{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
  @media(max-width:760px){.layout{grid-template-columns:1fr}}
  /* sidebar */
  .side{border-right:1px solid var(--border);background:var(--panel-2);padding:12px 0;overflow-y:auto;max-height:100vh;position:sticky;top:0}
  .side .grp{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--ink-faint);padding:12px 16px 4px}
  .side a{display:flex;justify-content:space-between;gap:8px;padding:6px 16px;font-size:12.5px;cursor:pointer;border-left:3px solid transparent;color:var(--ink)}
  .side a:hover{background:var(--panel)}
  .side a.on{background:var(--panel);border-left-color:var(--accent);font-weight:600}
  .side a .cl{color:var(--ink-faint);font-size:11px;font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;margin-top:5px}
  .d-cfg{background:var(--good)}.d-sch{background:var(--accent)}.d-hum{background:var(--gold)}
  /* main */
  .main{padding:20px 26px;max-width:820px}
  .sheet{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .sh{padding:13px 16px;border-bottom:1px solid var(--border);background:var(--panel-2)}
  .sh .id{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-faint)}
  .sh .nm{font-size:17px;font-weight:700;margin:1px 0 4px}
  .sh .meta{font-size:11.5px;color:var(--ink-muted)}
  .badge{font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 9px;border-radius:10px;text-transform:uppercase;margin-left:6px}
  .b-dt{background:var(--teal-soft);color:var(--teal)}.b-es{background:var(--good-soft);color:var(--good)}
  .b-ref{background:var(--purple-soft);color:var(--purple)}.b-mx{background:#e6e0f2;color:#5a3f82}.b-hum{background:var(--gold-soft);color:var(--gold)}
  .sec{padding:11px 16px;border-bottom:1px solid var(--border)}.sec:last-child{border-bottom:0}
  .sec h3{margin:0 0 7px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
  .stmt{font-size:13.5px;background:var(--gold-soft);border-left:3px solid var(--gold);padding:8px 11px;border-radius:4px}
  table{border-collapse:collapse;width:100%;font-size:12px}
  th,td{border:1px solid var(--border);padding:5px 8px;text-align:left;vertical-align:top}
  th{background:var(--panel-2);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-muted)}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px}
  .in-col{background:#faf6ef}
  .yes{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
  .steps{background:var(--code);border-radius:7px;padding:11px 13px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#e8e2d4;line-height:1.7}
  .steps .kw{color:#94c3d6}.steps .num{color:#c8b8e6}.steps .st{color:#d6a584}.steps .cmt{color:#7c8896}.steps .ok{color:#b6dcb6}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:3px 10px}
  .chip.sch{background:var(--accent-soft);border-color:#e5d2bf;color:var(--accent);font-weight:600}
  .chip.ref{background:var(--purple-soft);border-color:#d8c9e6;color:var(--purple);font-weight:600}
  .tc-pass{color:var(--good);font-weight:700}.tc-fail{color:var(--bad);font-weight:700}
  .warn{background:var(--bad-soft);border:1px solid #e6c9c9;border-radius:6px;padding:8px 11px;font-size:12px;color:#6d2020}
  .warn b{color:var(--bad)}
  ul.cap{margin:4px 0 0;padding-left:18px;font-size:12.5px}ul.cap li{margin-bottom:2px}
</style>
</head>
<body>
<div class="top">
  <h1>Cats &amp; Dogs IHS — full rule specifications</h1>
  <div class="sub">All 29 rules, each specified build-ready. Legend: <span style="color:var(--good)">● config</span> · <span style="color:var(--accent)">● config + scheduler</span> · <span style="color:var(--gold)">● human-in-the-loop</span>. Human spec — maps 1:1 to BRE config.</div>
</div>
<div class="layout">
  <div class="side" id="side"></div>
  <div class="main"><div class="sheet" id="sheet"></div></div>
</div>

<script>
const R=[
{k:'1.5a',a:'Part 1 — General',cl:'1.5(1)',nm:'Approved exporting countries',badge:'Reference data',bcls:'b-ref',disp:'cfg',
 meta:'IHS §1.5(1) · v2021-04-07',
 stmt:`Importers may only import eligible cats and dogs from countries the CTO has approved (animal health status, regulatory systems, equivalence capability).`,
 inputs:[['country_of_export','reference','application']],
 logic:{type:'ref',rows:[['Attribute','Example'],['country','United States'],['category','3'],['status','active'],['effective_from','2024-01-01']]},
 outputs:[['is_approved','boolean'],['category','1 | 2 | 3']],
 deps:[{t:'Feeds category → permit / pathway',c:''},{t:'Adding a country = CTO judgement (§1.5 human rule)',c:''}],
 refdata:`ApprovedCountries master list (with category). Change-managed as data.`,
 tests:[['US','<span class="tc-pass">approved · Cat 3</span>'],['unapproved country','<span class="tc-fail">not eligible</span> (unless equivalence)']],
 warn:`The <b>list</b> is data; whether a NEW country qualifies is a CTO judgement (see §1.5 human rule). MPI reserves audit rights (§1.5(2)).`},

{k:'1.5b',a:'Part 1 — General',cl:'1.5(1-2)',nm:'Adding / auditing a country',badge:'Human-in-the-loop',bcls:'b-hum',disp:'hum',
 meta:'IHS §1.5(1)(2) · CTO discretion',
 stmt:`A country is added only on evidence "to the satisfaction of a CTO" of health status, regulatory systems and equivalence. MPI may audit at any time.`,
 inputs:[['country evidence dossier','documents','exporting Competent Authority']],
 logic:{type:'hum',judgement:`CTO assesses the evidence against (a) health status, (b) regulatory systems, (c) equivalence capability, and decides to add + assign a category.`,
   captures:['Evidence reviewed','Decision (approve / decline)','Assigned category','CTO rationale + direction reference']},
 outputs:[['decision','approve | decline'],['assigned_category','1|2|3'],['cto_direction_ref','id']],
 deps:[{t:'On approval → updates ApprovedCountries reference data',c:'ref'}],
 refdata:`Writes to ApprovedCountries.`,
 tests:[['new country, strong evidence','routed to CTO → decision recorded']],
 warn:`Pure discretion — not codifiable. The system supports the case and records the rationale; it does not make the call.`},

{k:'1.6a',a:'Part 1 — General',cl:'1.6(1)',nm:'Approved laboratory',badge:'Reference data',bcls:'b-ref',disp:'cfg',
 meta:'IHS §1.6(1) · v2021-04-07',
 stmt:`Any laboratory doing pre-export/surveillance testing must be approved by the Competent Authority of an approved exporting country.`,
 inputs:[['lab','reference','vet cert / lab report'],['country','reference','application']],
 logic:{type:'es',steps:[['check','lab','approved by','Competent Authority of an approved country','','← reference / attestation']]},
 outputs:[['lab_approved','boolean']],
 deps:[{t:'Consumed by every test-based rule (2.x)',c:''},{t:'Reference: ApprovedLabs',c:'ref'}],
 refdata:`ApprovedLabs — or reliance on CA attestation; confirm source of truth.`,
 tests:[['AHL Australia','<span class="tc-pass">approved</span>'],['unknown lab','<span class="tc-fail">fail</span>']],
 warn:`"Approved by the CA of the exporting country" may rely on CA attestation rather than an MPI-held list for all labs — confirm during PoC.`},

{k:'1.6b',a:'Part 1 — General',cl:'1.6(3)',nm:'Approved tests & vaccines',badge:'Reference data',bcls:'b-ref',disp:'cfg',
 meta:'IHS §1.6(3) · v2021-04-07',
 stmt:`Diagnostic tests and vaccines used must be approved by MPI and listed in MPI-STD-TVTL.`,
 inputs:[['test_method','reference','lab report'],['vaccine_product','reference','vet cert']],
 logic:{type:'es',steps:[['step 1','test_method','in','MPI-STD-TVTL','','← reference data'],['step 2','vaccine_product','in','approved vaccines','','← reference data']]},
 outputs:[['test_approved','boolean'],['vaccine_approved','boolean']],
 deps:[{t:'Used by rabies (2.1) and organism tests (2.4–2.9)',c:''},{t:'Reference: MPI-STD-TVTL',c:'ref'}],
 refdata:`MPI-STD-TVTL — the approved tests/vaccines standard.`,
 tests:[['FAVN titre test','<span class="tc-pass">approved</span>'],['unlisted test','<span class="tc-fail">fail</span>']],
 warn:`Reference data with its own version; when TVTL updates, this rule reads the new list automatically.`},

{k:'1.6c',a:'Part 1 — General',cl:'1.6(4)',nm:'Treatment details recorded',badge:'Expression set',bcls:'b-es',disp:'cfg',
 meta:'IHS §1.6(4) · v2021-04-07',
 stmt:`Product name, manufacturer, active ingredient (where applicable), dose and date of treatment must be recorded on the veterinary certificate.`,
 inputs:[['product_name','text','vet cert'],['manufacturer','text','vet cert'],['active_ingredient','text','vet cert'],['dose','text','vet cert'],['treatment_date','date','vet cert']],
 logic:{type:'es',steps:[['check','all required fields','present & non-null','for each treatment record','','']]},
 outputs:[['record_complete','boolean'],['missing_fields','list']],
 deps:[{t:'Feeds each treatment/test rule',c:''},{t:'Document AI extraction',c:''}],
 refdata:`None.`,
 tests:[['all fields present','<span class="tc-pass">complete</span>'],['dose missing','<span class="tc-fail">incomplete</span>']],
 warn:`Tests <b>completeness of the record</b>, not correctness of the treatment (that's the specific organism rule).`},

{k:'1.7',a:'Part 1 — General',cl:'1.7',nm:'Pre / post veterinary inspection',badge:'Human-in-the-loop',bcls:'b-hum',disp:'hum',
 meta:'IHS §1.7 · v2021-04-07',
 stmt:`Pre-shipment veterinary inspection + compliance verification; post-arrival veterinary inspection + document verification.`,
 inputs:[['animal','—','physical'],['documents','—','consignment']],
 logic:{type:'hum',judgement:`An OV / MPI officer physically inspects the animal and verifies compliance. Physical findings can override document state.`,
   captures:['Inspection outcome (pass / fail / refer)','Findings','Officer','Timestamp']},
 outputs:[['inspection_outcome','pass | fail | refer'],['findings','text']],
 deps:[{t:'Post-arrival inspection feeds clearance (§1.12)',c:''}],
 refdata:`None.`,
 tests:[['clean physical exam','pass'],['parasites found','refer / extend']],
 warn:`Clinical / physical judgement — not codifiable. System captures structured findings + rationale.`},

{k:'1.8bed',a:'Part 1 — General',cl:'1.8(4)',nm:'Bedding & accompanying materials',badge:'Decision table',bcls:'b-dt',disp:'cfg',
 meta:'IHS §1.8(4) · v2021-04-07',
 stmt:`Straw or hay bedding is not permitted. Only inert bedding is permitted; any material (bedding, toys, clothing) will be destroyed on arrival for ectoparasite control.`,
 inputs:[['material_type','enum {straw_or_hay, inert_bedding, toys_or_clothing, other}','declared / observed']],
 logic:{type:'dt',cols:['#','Material is…','Permitted?','Action on arrival'],rows:[
   ['1','straw or hay','<span class="no">✖ No</span>','—'],['2','inert bedding','<span class="yes">✔ Yes</span>','Destroy'],['3','toys / clothing / other','<span class="yes">✔ May accompany</span>','Destroy']]},
 outputs:[['transport_permitted','boolean'],['arrival_action','none | destroy'],['compliance_flag','boolean']],
 deps:[{t:'Links to §1.7 post-arrival inspection (officer destroys)',c:''},{t:'No timing',c:''}],
 refdata:`Optional "permitted bedding types" list.`,
 tests:[['straw','<span class="tc-fail">not permitted</span>'],['inert mat','<span class="tc-pass">permitted</span> · destroy'],['toy','permitted · destroy']],
 warn:`The rule <b>flags</b> destruction; an officer performs it (§1.7). Declared vs inspected material can differ — inspection is authoritative.`},

{k:'1.8seal',a:'Part 1 — General',cl:'1.8(6)',nm:'Crate seal (except Australia)',badge:'Decision table',bcls:'b-dt',disp:'cfg',
 meta:'IHS §1.8(6) · v2021-04-07',
 stmt:`The crate door of all animals except those from Australia must be sealed with a government-approved seal.`,
 inputs:[['country_of_export','reference','application'],['seal_present','boolean','inspection'],['seal_type','reference','inspection']],
 logic:{type:'dt',cols:['#','Condition','Result'],rows:[
   ['1','from Australia','seal not required'],['2','not AU + government-approved seal','<span class="yes">compliant</span>'],['3','not AU + no/invalid seal','<span class="no">non-compliant</span>']]},
 outputs:[['seal_required','boolean'],['compliant','boolean']],
 deps:[{t:'Reference: approved seal types',c:'ref'},{t:'Verified at border',c:''}],
 refdata:`Approved government seal types.`,
 tests:[['US, no seal','<span class="tc-fail">non-compliant</span>'],['US, approved seal','<span class="tc-pass">ok</span>'],['AU, no seal','ok']],
 warn:`Seal integrity is confirmed physically at the border (§1.7).`},

{k:'1.8not',a:'Part 1 — General',cl:'1.8(8)',nm:'72-hour advance notice',badge:'Scheduler',bcls:'b-es',disp:'sch',
 meta:'IHS §1.8(8) · v2021-04-07',
 stmt:`Advance notification of arrival (air or sea) must be sent to the port at least 72 hours before scheduled arrival.`,
 inputs:[['notice_sent_date','datetime','system'],['arrival_date','datetime','application']],
 logic:{type:'es',steps:[['constraint','notice_sent','≤','arrival − 72h','','← scheduler window']]},
 outputs:[['notice_window','[ −∞ , arrival − 72h ]'],['compliant','boolean']],
 deps:[{t:'Scheduler',c:'sch'},{t:'Triggers inspector dossier generation',c:''}],
 refdata:`None.`,
 tests:[['notice 4 days before','<span class="tc-pass">ok</span>'],['notice 1 day before','<span class="tc-fail">late</span>']],
 warn:`Timing rule — the window is scheduler data, not logic.`},

{k:'1.9per',a:'Part 1 — General',cl:'1.9(1)',nm:'Import permit required',badge:'Decision matrix',bcls:'b-mx',disp:'cfg',
 meta:'IHS §1.9(1) · v2021-04-07',
 stmt:`An import permit is required prior to importation from specified countries — except Australia (no permit).`,
 inputs:[['country_of_export','reference','application']],
 logic:{type:'mx',cols:['Country','Permit required?'],rows:[['Australia','<span class="no">No</span>'],['All other approved countries','<span class="yes">Yes</span>']]},
 outputs:[['permit_required','boolean']],
 deps:[{t:'Drives the permit/application case',c:''},{t:'Equivalence path (§1.9(2-3))',c:''}],
 refdata:`Uses country reference data.`,
 tests:[['US','<span class="yes">required</span>'],['AU','not required']],
 warn:`Could equally be a column in the country matrix (§1.5) — model once, reuse.`},

{k:'1.9eq',a:'Part 1 — General',cl:'1.9(2-3)',nm:'Equivalence / negotiated certificate',badge:'Human-in-the-loop',bcls:'b-hum',disp:'hum',
 meta:'IHS §1.9(2-3) · Biosecurity Act s24D / s27',
 stmt:`A CTO may approve an equivalent measure (permit under s24D) or a negotiated veterinary certificate different from the IHS.`,
 inputs:[['proposed_measure','documents','importer/exporter']],
 logic:{type:'hum',judgement:`The CTO assesses whether the proposed alternative achieves an equivalent biosecurity outcome, and approves or declines.`,
   captures:['Proposed measure','CTO decision','Rationale','CTO direction / permit reference']},
 outputs:[['decision','approve | decline'],['cto_direction_ref','id']],
 deps:[{t:'Overrides standard requirements for that consignment',c:''}],
 refdata:`None.`,
 tests:[['alternative treatment proposed','routed to CTO → recorded']],
 warn:`Pure discretion (s27(1)(d)) — not codifiable. System routes, records rationale, links the direction to the case.`},

{k:'1.10',a:'Part 1 — General',cl:'1.10',nm:'Documentation completeness',badge:'Expression set',bcls:'b-es',disp:'cfg',
 meta:'IHS §1.10 · v2021-04-07',
 stmt:`Consignment must arrive with an import permit (required fields) and a veterinary certificate (required fields incl. OV endorsement of Part 1 & Part 2).`,
 inputs:[['permit_fields','set','permit'],['cert_fields','set','vet cert'],['ov_endorsements','set','vet cert']],
 logic:{type:'es',steps:[['step 1','import permit','present with fields','(exporter, animal, microchip, date, facility, port)','',''],['step 2','vet cert','present with fields','(consignment id, animal, microchip, parties, OV details)','',''],['step 3','OV endorsements','present','for Part 1 AND Part 2','','']]},
 outputs:[['docs_complete','boolean'],['missing','list']],
 deps:[{t:'Document AI extraction',c:''},{t:'Gates submission & clearance',c:''}],
 refdata:`None.`,
 tests:[['all present','<span class="tc-pass">complete</span>'],['facility missing','<span class="tc-fail">incomplete</span>']],
 warn:`Presence/completeness, not truth of contents (that's each specific rule + OV endorsement).`},

{k:'1.11',a:'Part 1 — General',cl:'1.11',nm:'Post-arrival quarantine',badge:'Scheduler',bcls:'b-es',disp:'sch',
 meta:'IHS §1.11 · v2021-04-07',
 stmt:`From all countries except Australia, proceed to the named transitional facility for a minimum of 10 days, or until all biosecurity requirements are met.`,
 inputs:[['country_of_export','reference','application'],['arrival_date','date','system'],['facility','reference','permit']],
 logic:{type:'es',steps:[['step 1','quarantine_required','=','country ≠ Australia','',''],['step 2','quarantine_start','=','arrival_date','',''],['step 3','min_release','=','arrival + 10 days','','← scheduler duration'],['step 4','facility','in','ApprovedFacilities','','← reference data']]},
 outputs:[['quarantine_required','boolean'],['min_release_date','date'],['facility_valid','boolean']],
 deps:[{t:'Scheduler (duration)',c:'sch'},{t:'Reference: approved facilities',c:'ref'},{t:'Non-compliance extends',c:''}],
 refdata:`MPI-approved transitional facilities.`,
 tests:[['US arrival','<span class="tc-pass">10-day min</span>'],['AU','no quarantine (unless non-compliant)']],
 warn:`"…or until all requirements met" — release can be later than day 10 if issues arise (officer decision).`},

{k:'1.12',a:'Part 1 — General',cl:'1.12',nm:'Biosecurity clearance',badge:'Human-in-the-loop',bcls:'b-hum',disp:'hum',
 meta:'IHS §1.12 · Biosecurity Act s26/s27',
 stmt:`A biosecurity clearance may be issued when the animal meets all IHS requirements and the applicable s27 conditions are met.`,
 inputs:[['all_requirement_outcomes','aggregate','engine'],['inspection_outcome','—','§1.7']],
 logic:{type:'hum',judgement:`The rules gate eligibility (all applicable requirements MET + inspection passed); the issuance of clearance is a statutory officer act.`,
   captures:['Aggregate requirement outcomes','Inspection result','Clearance decision + officer','Sealed determination']},
 outputs:[['clearance_eligible','boolean (gate)'],['clearance','issued | withheld'],['issued_date','date']],
 deps:[{t:'Aggregates ALL rules (composed determination)',c:''},{t:'Post-arrival inspection (§1.7)',c:''}],
 refdata:`None.`,
 tests:[['all met + inspection clean','eligible → officer issues'],['one requirement unmet','not eligible']],
 warn:`Rules gate eligibility; a human issues clearance (statutory act). This is the composed, sealed determination.`},

{k:'2.0',a:'Part 2 — Specified organisms',cl:'2.0',nm:'OV veterinary certificate',badge:'Expression set',bcls:'b-es',disp:'cfg',
 meta:'IHS Part 2 intro · v2021-04-07',
 stmt:`The Veterinary Authority of the exporting country issues a signed, stamped and dated certificate containing the declarations for the applicable diseases.`,
 inputs:[['signed','boolean','cert'],['stamped','boolean','cert'],['dated','boolean','cert'],['declarations','set','cert']],
 logic:{type:'es',steps:[['check','signed AND stamped AND dated','present','',''],['check','a declaration present','for each applicable Part 2 requirement','','']]},
 outputs:[['cert_valid','boolean'],['missing_declarations','list']],
 deps:[{t:'Aggregates Part 2 declarations',c:''},{t:'OV endorsement (§1.10)',c:''}],
 refdata:`None.`,
 tests:[['signed/stamped/dated + all declarations','<span class="tc-pass">valid</span>'],['rabies declaration missing','<span class="tc-fail">invalid</span>']],
 warn:`Wrapper/completeness rule over the specific organism declarations.`},

{k:'2.1',a:'Part 2 — Specified organisms',cl:'2.1',nm:'Rabies',badge:'Expression set',bcls:'b-es',disp:'sch',
 meta:'IHS §2.1 · v2021-04-07',
 stmt:`Rabies-free residence since birth or 6 months (no clinical signs) OR vaccinated per rules AND rabies titre ≥0.5 IU/ml sampled 3–24 months before shipment (no clinical signs).`,
 inputs:[['residence_history','—','declaration'],['vaccination_type','primary|booster','cert'],['vaccination_date','date','cert'],['titre_value','number','lab'],['titre_sample_date','date','lab'],['shipment_date','date','application'],['clinical_signs','boolean','OV exam']],
 logic:{type:'es',steps:[['Branch A','resident rabies-free country since birth/6mo','AND','no clinical signs','',''],['— OR —','','','','',''],['Branch B1','vaccination','primary 6mo–1yr before ship (age ≥3mo) OR booster ≤1yr','','← scheduler'],['Branch B2','titre_value','≥','0.5','IU/ml',''],['Branch B3','titre_sample_date','within','[ ship−24mo , ship−3mo ]','','← scheduler'],['Branch B4','no clinical signs','','','','← human (OV)']]},
 outputs:[['satisfied','boolean'],['branch_used','A | B'],['reasons','list']],
 deps:[{t:'Scheduler: vaccination & titre windows; vaccination → titre sequence',c:'sch'},{t:'Reference: approved vaccine/test (§1.6)',c:'ref'},{t:'"No clinical signs" = OV exam',c:''}],
 refdata:`OIE rabies-free country status (Branch A); MPI-STD-TVTL (Branch B).`,
 tests:[['booster + titre 0.7 sampled 90d before','<span class="tc-pass">MET (B)</span>'],['titre 0.4','<span class="tc-fail">UNMET</span>'],['rabies-free residence 8mo','<span class="tc-pass">MET (A)</span>']],
 warn:`Disjunction (two whole branches). "No clinical signs on day of shipment" is a clinical judgement. Branch A depends on OIE rabies-free status.`},

{k:'2.2',a:'Part 2 — Specified organisms',cl:'2.2',nm:'External parasites',badge:'Expression set',bcls:'b-es',disp:'sch',
 meta:'IHS §2.2 · v2021-04-07',
 stmt:`Treated twice with a registered tick/flea product at recommended dose, certified free at each treatment. #1 within 30 days prior and ≥2 weeks before #2; #2 within 2 days prior. Inspected free post-arrival.`,
 inputs:[['treatment1_date','date','cert'],['treatment2_date','date','cert'],['product','reference','cert'],['dose','text','cert'],['shipment_date','date','application']],
 logic:{type:'es',steps:[['step 1','product','registered for','ticks & fleas','',''],['step 2','treatment1_date','within','[ ship−30d , … ] AND ≤ treatment2 − 14d','','← scheduler'],['step 3','treatment2_date','within','[ ship−2d , ship ]','','← scheduler'],['step 4','certified free','at each treatment','','','']]},
 outputs:[['satisfied','boolean'],['reasons','list']],
 deps:[{t:'Scheduler: windows + 14-day gap',c:'sch'},{t:'Post-arrival "free of parasites" = inspection',c:''}],
 refdata:`Registered ectoparasite products.`,
 tests:[['#1 27d before, #2 1d before','<span class="tc-pass">MET</span>'],['gap 11 days','<span class="tc-fail">UNMET</span>']],
 warn:`Post-arrival "free of external parasites" (§2.2(2)) is an inspection judgement.`},

{k:'2.3',a:'Part 2 — Specified organisms',cl:'2.3',nm:'Internal parasites',badge:'Expression set',bcls:'b-es',disp:'sch',
 meta:'IHS §2.3 · v2021-04-07',
 stmt:`Treated twice with a product for nematodes and cestodes at recommended dose. #1 within 30 days prior and ≥2 weeks before #2; #2 within 4 days prior.`,
 inputs:[['treatment1_date','date','cert'],['treatment2_date','date','cert'],['active_ingredient','reference','cert'],['dose','text','cert'],['shipment_date','date','application']],
 logic:{type:'es',steps:[['step 1','active','covers','nematodes AND cestodes','',''],['step 2','treatment1_date','within','[ ship−30d , … ] AND ≤ treatment2 − 14d','','← scheduler'],['step 3','treatment2_date','within','[ ship−4d , ship ]','','← scheduler']]},
 outputs:[['satisfied','boolean'],['reasons','list']],
 deps:[{t:'Scheduler: windows + 14-day gap',c:'sch'},{t:'Reference: registered products / actives',c:'ref'}],
 refdata:`Registered anthelmintics (nematode + cestode cover).`,
 tests:[['#1 27d, #2 3d','<span class="tc-pass">MET</span>'],['#2 6d before','<span class="tc-fail">UNMET (window)</span>']],
 warn:`The worked example from the spec-sheet demo — coupled #1/#2 timing feeds the scheduler.`},

{k:'2.4',a:'Part 2 — Specified organisms',cl:'2.4',nm:'Babesia canis (South Africa history)',badge:'Expression set',bcls:'b-es',disp:'sch',
 meta:'IHS §2.4 · v2021-04-07',
 stmt:`Applies to dogs ever resident in / travelled to South Africa. Free of ticks before each ext-parasite treatment; AND treatment in 16d prior OR IFA/ELISA negative in 16d prior OR two PCR negative (30–37d apart, 2nd in 16d prior).`,
 inputs:[['sa_history','boolean','declaration'],['tick_inspection','—','OV'],['test_result','—','lab'],['test_dates','date','lab'],['shipment_date','date','application']],
 logic:{type:'es',steps:[['applies_when','sa_history','=','true','','← decision table'],['Branch 1','approved treatment','within','[ ship−16d , ship ]','','← scheduler'],['Branch 2','IFA/ELISA','negative within','[ ship−16d , ship ]','',''],['Branch 3','two PCR negative','30–37d apart, 2nd in 16d prior','','','← scheduler interval']]},
 outputs:[['applies','boolean'],['satisfied','boolean'],['branch_used','1|2|3']],
 deps:[{t:'Tied to ext-parasite tick inspection (§2.2)',c:''},{t:'Scheduler: 16d window, 30–37d PCR interval',c:'sch'}],
 refdata:`Approved tests/treatments.`,
 tests:[['no SA history','N/A'],['SA + ELISA neg 10d before','<span class="tc-pass">MET</span>'],['PCRs 20d apart','<span class="tc-fail">UNMET (interval)</span>']],
 warn:`Conditional applicability (SA history) + 3-branch disjunction.`},

{k:'2.5',a:'Part 2 — Specified organisms',cl:'2.5',nm:'Babesia gibsoni (dogs)',badge:'Expression set',bcls:'b-es',disp:'sch',
 meta:'IHS §2.5 · v2021-04-07',
 stmt:`Free of ticks/healthy before each ext-parasite treatment; AND IFA/ELISA negative in 16d prior OR two PCR negative (30–37d apart, 2nd in 16d prior). Diagnosed → NOT eligible regardless of treatment.`,
 inputs:[['species','dog','application'],['tick_inspection','—','OV'],['test_result','—','lab'],['diagnosed','boolean','history'],['shipment_date','date','application']],
 logic:{type:'es',steps:[['GATE','diagnosed','=','true → NOT ELIGIBLE','','← hard gate'],['Branch 1','IFA/ELISA','negative within','[ ship−16d , ship ]','',''],['Branch 2','two PCR negative','30–37d apart, 2nd in 16d prior','','','← scheduler']]},
 outputs:[['applies','dogs'],['satisfied','boolean'],['eligibility_gate','eligible | ineligible']],
 deps:[{t:'Scheduler: 16d window, interval',c:'sch'},{t:'Linked to §2.2 inspection',c:''}],
 refdata:`Approved tests.`,
 tests:[['ELISA neg 12d','<span class="tc-pass">MET</span>'],['diagnosed','<span class="tc-fail">INELIGIBLE</span>']],
 warn:`A hard eligibility gate overrides satisfaction — model as a gate above the disjunction.`},

{k:'2.6',a:'Part 2 — Specified organisms',cl:'2.6',nm:'Brucella canis (dogs)',badge:'Expression set',bcls:'b-es',disp:'sch',
 meta:'IHS §2.6 · v2021-04-07',
 stmt:`One of five test pathways negative in 16d prior (RSAT / TAT / CPAg-AGID / positive-then-AGID / suspicious-TAT-retest 30–42d); AND for entire dogs an owner declaration of no mating in 44d prior. Diagnosed → NOT eligible.`,
 inputs:[['test_type/results/dates','—','lab'],['entire','boolean','application'],['mating_declaration','boolean','owner'],['shipment_date','date','application'],['diagnosed','boolean','history']],
 logic:{type:'es',steps:[['GATE','diagnosed','=','true → NOT ELIGIBLE','','← hard gate'],['Branch 1','RSAT','negative in 16d','','',''],['Branch 2','TAT','negative in 16d','','',''],['Branch 3','CPAg-AGID','negative in 16d','','',''],['Branch 4','positive/inconclusive RSAT/TAT → CPAg-AGID','negative in 16d','','',''],['Branch 5','suspicious TAT retested 30–42d later','negative in 16d','','','← scheduler interval'],['+ if entire','owner declaration','no mating in','[ ship−44d , ship ]','','← scheduler + conditional']]},
 outputs:[['applies','dogs'],['satisfied','boolean'],['branch_used','1–5'],['eligibility_gate','eligible|ineligible']],
 deps:[{t:'Scheduler: 16d window, 30–42d retest',c:'sch'},{t:'Cross-standard: semen IHS (if AI used)',c:'ref'}],
 refdata:`Approved tests; semen IHS.`,
 tests:[['RSAT neg 10d, entire + declaration','<span class="tc-pass">MET</span>'],['suspicious TAT retest 20d','<span class="tc-fail">UNMET (interval)</span>'],['diagnosed','<span class="tc-fail">INELIGIBLE</span>']],
 warn:`The stress-test case: 5-branch disjunction + entire-dog conditional + gate + a cross-standard reference. Still standard BRE — just carefully modelled.`},

{k:'2.7',a:'Part 2 — Specified organisms',cl:'2.7',nm:'Canine transmissible venereal tumour',badge:'Human-in-the-loop',bcls:'b-hum',disp:'hum',
 meta:'IHS §2.7 · v2021-04-07',
 stmt:`Entire dogs: external genitalia examined in the 2 days prior to shipment, with no lesions suggestive of CTVT.`,
 inputs:[['entire','boolean','application'],['exam_date','date','OV'],['exam_finding','—','OV'],['shipment_date','date','application']],
 logic:{type:'es',steps:[['applies_when','entire','=','true','','← decision table'],['step 1','exam_date','within','[ ship−2d , ship ]','','← scheduler'],['step 2','finding','=','no lesions suggestive of CTVT','','← human (clinical)']]},
 outputs:[['applies','entire dogs'],['exam_within_window','boolean'],['satisfied','boolean']],
 deps:[{t:'Scheduler: 2-day window',c:'sch'},{t:'Clinical exam = human',c:''}],
 refdata:`None.`,
 tests:[['entire, exam 1d before, no lesions','<span class="tc-pass">MET</span>'],['neutered','N/A']],
 warn:`"No lesions suggestive of" = veterinary judgement — not codifiable. System records the finding + the within-window check.`},

{k:'2.8',a:'Part 2 — Specified organisms',cl:'2.8',nm:'Heartworm (Dirofilaria immitis)',badge:'Expression set',bcls:'b-es',disp:'sch',
 meta:'IHS §2.8 · v2021-04-07',
 stmt:`If ≥6 months old on shipment date, heartworm antigen ELISA negative in 30d prior; AND all dogs (any age) treated with a registered preventive in 4d prior OR up-to-date with a sustained-release injection.`,
 inputs:[['age_at_shipment','months','application'],['elisa_result','—','lab'],['elisa_date','date','lab'],['treatment_date/type','—','cert'],['shipment_date','date','application']],
 logic:{type:'es',steps:[['conditional','if age ≥ 6mo','→ ELISA required','','','← decision table'],['step 1','ELISA','negative within','[ ship−30d , ship ]','','← scheduler'],['step 2','treatment','in [ ship−4d , ship ] OR sustained-release current','','','← scheduler']]},
 outputs:[['applies','dogs'],['elisa_required','boolean'],['satisfied','boolean']],
 deps:[{t:'Scheduler: 30d & 4d windows',c:'sch'},{t:'Reference: registered preventives',c:'ref'}],
 refdata:`Registered heartworm preventives.`,
 tests:[['2yo, ELISA neg 20d, treated 3d','<span class="tc-pass">MET</span>'],['4mo pup','ELISA not required; treatment still required']],
 warn:`Age-conditional applicability for the ELISA; treatment applies to all ages.`},

{k:'2.9',a:'Part 2 — Specified organisms',cl:'2.9',nm:'Leptospirosis (L. canicola)',badge:'Expression set',bcls:'b-es',disp:'sch',
 meta:'IHS §2.9 · v2021-04-07',
 stmt:`Approved treatment course in 30d prior OR MAT negative in 30d prior OR MAT ≤1:400 in 30d prior with a second MAT ≥14 days later showing no titre increase.`,
 inputs:[['treatment_date','date','cert'],['mat_titre','number','lab'],['mat_date','date','lab'],['second_mat','—','lab'],['shipment_date','date','application']],
 logic:{type:'es',steps:[['Branch 1','approved treatment','within','[ ship−30d , ship ]','','← scheduler'],['Branch 2','MAT','negative within','[ ship−30d , ship ]','',''],['Branch 3','MAT ≤1:400 + 2nd MAT ≥14d later','no increase','','','← scheduler gap']]},
 outputs:[['applies','dogs'],['satisfied','boolean'],['branch_used','1|2|3']],
 deps:[{t:'Scheduler: 30d window, ≥14d retest gap',c:'sch'}],
 refdata:`Approved treatments/tests.`,
 tests:[['treated 20d before','<span class="tc-pass">MET</span>'],['MAT 1:400 + retest 10d later','<span class="tc-fail">UNMET (gap)</span>']],
 warn:`Three-branch disjunction with a conditional retest.`},

{k:'2.10',a:'Part 2 — Specified organisms',cl:'2.10',nm:'Canine influenza',badge:'Expression set',bcls:'b-es',disp:'sch',
 meta:'IHS §2.10 · v2021-04-07',
 stmt:`For at least 21 days before shipment: not kept where cats/dogs showed clinical signs of infectious respiratory disease, and showed no clinical signs itself.`,
 inputs:[['exposure_history_21d','—','declaration'],['clinical_signs_21d','boolean','observation'],['shipment_date','date','application']],
 logic:{type:'es',steps:[['step 1','no exposure to symptomatic animals','over','[ ship−21d , ship ]','','← scheduler'],['step 2','no clinical signs','over','[ ship−21d , ship ]','','← observation / attestation']]},
 outputs:[['applies','cats & dogs'],['satisfied','boolean']],
 deps:[{t:'Scheduler: 21-day window',c:'sch'},{t:'Attestation / observation',c:''}],
 refdata:`None.`,
 tests:[['21d clear, no signs','<span class="tc-pass">MET</span>'],['exposure 10d before','<span class="tc-fail">UNMET</span>']],
 warn:`Attestation of an absence over a period (not a test) — relies on observation/declaration + OV endorsement.`},

{k:'5.4',a:'Guidance (1575)',cl:'5.4',nm:'Microchip',badge:'Expression set',bcls:'b-es',disp:'sch',
 meta:'Guidance §5.4 · 2022-10-17',
 stmt:`ISO 11784/11785-compliant microchip, implanted before any vaccinations or tests (otherwise vaccinations/tests must be redone).`,
 inputs:[['microchip_id','text','scan/cert'],['microchip_standard','reference','cert'],['implant_date','date','cert'],['vaccination_date','date','cert']],
 logic:{type:'es',steps:[['step 1','microchip_standard','in','{ISO 11784, ISO 11785}','',''],['step 2','implant_date','before','vaccination_date AND all tests','','← scheduler sequence']]},
 outputs:[['microchip_valid','boolean'],['sequence_ok','boolean'],['satisfied','boolean']],
 deps:[{t:'Scheduler: implant-before sequence',c:'sch'},{t:'Join key for all evidence',c:''}],
 refdata:`None.`,
 tests:[['ISO chip implanted before vaccine','<span class="tc-pass">MET</span>'],['implanted after vaccine','<span class="tc-fail">FAIL — redo required</span>']],
 warn:`The microchip is the identity join key that links every document and test to the animal.`},

{k:'5.5',a:'Guidance (1575)',cl:'5.5',nm:'Breed / hybrid eligibility',badge:'Decision table',bcls:'b-dt',disp:'cfg',
 meta:'Guidance §5.5 · Dog Control Act 1996 Sch 4',
 stmt:`Importer breed declaration required. Prohibited breeds (Pit Bull Terrier, Dogo Argentino, Brazilian Fila, Japanese Tosa, Presa Canario) and hybrids are not eligible.`,
 inputs:[['breed','reference','declaration'],['is_hybrid','boolean','declaration']],
 logic:{type:'dt',cols:['#','Condition','Result'],rows:[
   ['1','breed ∈ prohibited list','<span class="no">✖ Not eligible</span>'],['2','is_hybrid','<span class="no">✖ Not eligible</span>'],['3','otherwise','<span class="yes">✔ Eligible</span>']]},
 outputs:[['eligible','boolean']],
 deps:[{t:'Reference: prohibited breed list',c:'ref'},{t:'Sworn declaration (attestation)',c:''}],
 refdata:`Dog Control Act Sch 4 prohibited breeds.`,
 tests:[['Border Collie','<span class="tc-pass">eligible</span>'],['Pit Bull','<span class="tc-fail">ineligible</span>'],['wolf-hybrid','<span class="tc-fail">ineligible</span>']],
 warn:`Sworn declaration is an attestation; breed may be assessed at inspection on arrival.`},

{k:'5.6',a:'Guidance (1575)',cl:'5.6',nm:'Permit lead time',badge:'Scheduler',bcls:'b-es',disp:'sch',
 meta:'Guidance §5.6 · working-day calendar',
 stmt:`Apply for the import permit the required number of working days before the intended travel date.`,
 inputs:[['permit_application_date','date','system'],['shipment_date','date','application']],
 logic:{type:'es',steps:[['constraint','application_date','≤','shipment − N working days','','← scheduler + working-day calendar']]},
 outputs:[['lead_time_ok','boolean'],['earliest_feasible_ship','date']],
 deps:[{t:'Scheduler + working-day calendar service',c:'sch'}],
 refdata:`Public-holiday calendar.`,
 tests:[['applied 40 wd before','<span class="tc-pass">ok</span>'],['applied 10 wd before','<span class="tc-fail">too late</span>']],
 warn:`Working days, not calendar days → needs a calendar service. Confirm the exact number (20 vs 30) against the IHS/guidance.`},

{k:'sch4',a:'Guidance (1575)',cl:'Sch 4',nm:'Prohibited breed list',badge:'Reference data',bcls:'b-ref',disp:'cfg',
 meta:'Dog Control Act 1996, Schedule 4',
 stmt:`The legislated list of prohibited dog breeds/types (and the no-hybrids rule).`,
 inputs:[['breed','—','—']],
 logic:{type:'ref',rows:[['Prohibited breed/type'],['American Pit Bull Terrier'],['Dogo Argentino'],['Brazilian Fila'],['Japanese Tosa'],['Perro de Presa Canario']]},
 outputs:[['is_prohibited(breed)','boolean']],
 deps:[{t:'Consumed by §5.5 eligibility',c:''}],
 refdata:`This IS the reference list.`,
 tests:[['lookup "Pit Bull"','<span class="tc-fail">prohibited</span>'],['lookup "Labrador"','allowed']],
 warn:`A legal list — changes via legislation, not MPI configuration. Model as read-only reference data.`}
];

// build sidebar
const groups=[...new Set(R.map(r=>r.a))];
const side=document.getElementById('side');
side.innerHTML=groups.map(g=>`<div class="grp">${g}</div>`+
  R.filter(r=>r.a===g).map(r=>`<a data-k="${r.k}"><span><span class="dot d-${r.disp}"></span> ${r.nm}</span><span class="cl">${r.cl}</span></a>`).join('')
).join('');

function render(k){
  const r=R.find(x=>x.k===k);
  document.querySelectorAll('.side a').forEach(a=>a.classList.toggle('on',a.dataset.k===k));
  let logic='';
  const L=r.logic;
  if(L.type==='dt'||L.type==='mx'||L.type==='ref'){
    logic=`<table>${L.rows.map((row,i)=>`<tr>${row.map(c=>i===0?`<th>${c}</th>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
    if(L.cols) logic=`<table><tr>${L.cols.map(c=>`<th>${c}</th>`).join('')}</tr>${L.rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
  }else if(L.type==='es'){
    logic=`<div class="steps">`+L.steps.map(s=>`<div><span class="kw">${s[0]}</span>  ${s[1]||''} <span class="kw">${s[2]||''}</span> <span class="num">${s[3]||''}</span> ${s[4]||''} ${s[5]?`<span class="cmt">${s[5]}</span>`:''}</div>`).join('')+`</div>`;
  }else if(L.type==='hum'){
    logic=`<div class="warn" style="background:var(--gold-soft);border-color:#e6d9ad;color:#5a481a">${L.judgement}</div>
      <div style="margin-top:8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:700">System captures (review task)</div>
      <ul class="cap">${L.captures.map(c=>`<li>${c}</li>`).join('')}</ul>`;
  }
  document.getElementById('sheet').innerHTML=`
    <div class="sh"><div class="id">${r.cl}</div><div class="nm">${r.nm}<span class="badge ${r.bcls}">${r.badge}</span></div><div class="meta">${r.meta}</div></div>
    <div class="sec"><h3>Statement (from the clause)</h3><div class="stmt">${r.stmt}</div></div>
    <div class="sec"><h3>Inputs (facts)</h3><table><tr><th>Fact</th><th>Type / values</th><th>Source</th></tr>${r.inputs.map(i=>`<tr><td class="mono">${i[0]}</td><td>${i[1]}</td><td>${i[2]}</td></tr>`).join('')}</table></div>
    <div class="sec"><h3>Logic — ${r.badge}</h3>${logic}</div>
    <div class="sec"><h3>Outputs</h3><table><tr><th>Output</th><th>Type / definition</th></tr>${r.outputs.map(o=>`<tr><td class="mono">${o[0]}</td><td>${o[1]}</td></tr>`).join('')}</table></div>
    <div class="sec"><h3>Dependencies &amp; cross-references</h3><div class="chips">${r.deps.map(d=>`<span class="chip ${d.c}">${d.t}</span>`).join('')}</div><div style="font-size:12px;color:var(--ink-muted);margin-top:7px">Reference data: ${r.refdata}</div></div>
    <div class="sec"><h3>Test cases</h3><table><tr><th>Input</th><th>Expected</th></tr>${r.tests.map(t=>`<tr><td>${t[0]}</td><td>${t[1]}</td></tr>`).join('')}</table></div>
    <div class="sec"><h3>Human-in-the-loop / assumptions / to confirm</h3><div class="warn">${r.warn}</div></div>`;
}
side.querySelectorAll('a').forEach(a=>a.onclick=()=>render(a.dataset.k));
render('1.5a');
</script>
